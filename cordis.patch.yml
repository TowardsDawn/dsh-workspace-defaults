# 工作区默认预设 / 默认模型（Host 插件）。
# 只在新会话创建时注入默认值：
#   - 预设：在 sessionController.createSession 之前补全 request.agentPreset；
#   - 模型：在 sessionController.createAgent 期间用 AsyncLocalStorage 覆盖
#     agentDefaultModel.currentSelection() 的返回值。
# 已有会话、以及会话内的预设/模型切换都不经过这些路径，因此不受影响。
# 安装方式：dsh plugin --profile web add "<GitHub 仓库或本地目录>"
#（dsh plugin 会把新包追加进 profile 的 dsh.profile.bundles）
- insert:
    - id: workspace-defaults
      name: '@TowardsDawn/dsh-workspace-defaults'
